<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10233f">
    <title>Account security | School Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <section class="card border-0 shadow">
                    <div class="card-body p-4 p-md-5">
                        <a class="small text-decoration-none" id="backToPortal" href="index.html"><i class="bi bi-arrow-left me-1"></i>Back to portal</a>
                        <div class="text-center my-4">
                            <i class="bi bi-shield-lock-fill text-primary" style="font-size: 2.75rem;"></i>
                            <h1 class="h2 mt-3">Account security</h1>
                            <p class="text-muted mb-1">Create or change your password. Your administrator will never see it.</p>
                            <p class="small text-muted" id="securityAccount"></p>
                        </div>
                        <div id="securityNotice" class="alert d-none" role="status" aria-live="polite"></div>
                        <form id="securityForm" hidden>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New password</label>
                                <input class="form-control" type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
                                <div class="form-text">Use at least 8 characters. Choose a password you do not use on another site.</div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmNewPassword" class="form-label">Confirm new password</label>
                                <input class="form-control" type="password" id="confirmNewPassword" autocomplete="new-password" minlength="8" required>
                            </div>
                            <div class="d-grid mt-4">
                                <button class="btn btn-primary" type="submit"><i class="bi bi-check2-circle me-1"></i>Save password</button>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <button class="btn btn-link text-decoration-none" type="button" id="securitySignOut" hidden>Sign out</button>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script type="module" src="account-security.js"></script>
</body>
</html>
