<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus-fill text-primary" style="font-size: 3rem;"></i>
                            <h2 class="mt-2">Create your student account</h2>
                            <p class="text-muted">Use the Student ID and school email provided by your school.</p>
                        </div>
                        <div id="supabaseSetupNotice" class="alert alert-warning d-none" role="status"></div>
                        <form id="registrationForm">
                            <div class="mb-3">
                                <label for="regStudentId" class="form-label">Student registration ID</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                    <input type="text" class="form-control" id="regStudentId" placeholder="For example, 2023CSE277" autocomplete="off" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="schoolEmail" class="form-label">School email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="schoolEmail" placeholder="name@school.edu" autocomplete="email" required>
                                </div>
                                <div class="form-text">Your Student ID and email must match the roster provided by your school.</div>
                            </div>
                            <div class="mb-3">
                                <label for="regPassword" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="regPassword" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
                                    <button class="btn btn-outline-secondary" type="button" id="toggleRegPassword" aria-label="Show password"><i class="bi bi-eye"></i></button>
                                </div>
                                <div class="form-text">Use at least 8 characters.</div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Enter the password again" autocomplete="new-password" minlength="8" required>
                                </div>
                            </div>
                            <div id="registrationFeedback" class="alert d-none mt-3" role="status"></div>
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">Create account <i class="bi bi-arrow-right ms-1"></i></button>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <p class="mb-0">Already registered? <a href="index.html" class="text-decoration-none">Sign in</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
